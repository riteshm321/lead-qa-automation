# Madison Logic brand theme — colors only, no workflow changes.
# See docs/superpowers/specs/2026-08-21-ui-branding-design.md for the design.
#
# `base = "light"` is the base palette for [theme] itself. Note: in
# Streamlit 1.61, once both [theme.light] and [theme.dark] are defined the
# frontend starts first-time visitors on "System" (follows the OS setting)
# regardless of `base`; the menu (top-right) still offers System / Light /
# Dark and remembers the choice per browser. There is no supported config
# option to default to Light while keeping the dark option.
[theme]
base = "light"
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"

[theme.light]
primaryColor = "#1C6BFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6FB"
textColor = "#001B47"
linkColor = "#1C6BFF"
borderColor = "#DEE3EF"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6FB"
textColor = "#001B47"

[theme.dark]
# Matches Madison Logic's own dark-section styling (dark CTA / footer
# treatments use this same navy/indigo pairing).
primaryColor = "#1C6BFF"
backgroundColor = "#001B47"
secondaryBackgroundColor = "#252E80"
textColor = "#F6F6FB"
linkColor = "#5B9BFF"
borderColor = "#3A4570"
