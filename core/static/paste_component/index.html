<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }
  #box {
    box-sizing: border-box;
    width: 100%;
    min-height: 60px;
    border: 2px dashed #999;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 14px;
    padding: 12px;
    cursor: text;
    outline: none;
  }
  #box:focus { border-color: #4a90d9; color: #333; }
</style>
</head>
<body>
<div id="box" tabindex="0">Click here, then press Ctrl+V to paste a screenshot</div>
<script>
  // Streamlit's documented custom-component iframe protocol (no npm
  // package, no CDN fetch): the frontend announces readiness, may report
  // its own height, and sends a value back to Python via postMessage.
  // See https://docs.streamlit.io/library/components/components-api
  //
  // isStreamlitMessage: true is REQUIRED on every message — Streamlit's
  // ComponentRegistry.onMessageEvent silently drops any postMessage that
  // doesn't carry this exact flag, before even looking at `type`.
  function sendReady() {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  }
  function setFrameHeight() {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: document.body.scrollHeight }, "*"
    );
  }
  function sendValue(value) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value, dataType: "json" }, "*"
    );
  }

  const box = document.getElementById("box");
  box.addEventListener("paste", function (event) {
    const items = (event.clipboardData || window.clipboardData).items;
    for (const item of items) {
      if (item.type.indexOf("image") === 0) {
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = function () {
          box.textContent = "Screenshot pasted — ready to attach.";
          setFrameHeight();
          sendValue(reader.result);
        };
        reader.readAsDataURL(blob);
        event.preventDefault();
        return;
      }
    }
  });

  sendReady();
  setFrameHeight();
</script>
</body>
</html>
